<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>API Health Monitor architecture</title>
  <desc>Clients call a single Node process whose HTTP pipeline applies request IDs, security headers, rate limiting, authentication and content negotiation before routing to REST resources backed by SQLite. A scheduler runs SSRF-guarded HTTP checks against public APIs, records outcomes and incidents, and publishes events over SSE. A scheduled GitHub Actions job builds a static snapshot from the same code for GitHub Pages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb0ff"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2a93b"/></marker>
    <style>
      .panel { fill: #15181d; stroke: #272c35; stroke-width: 1.5; }
      .title { fill: #e7e9ec; font-size: 15px; font-weight: 700; }
      .mono { font-family: Cascadia Mono, SF Mono, Menlo, Consolas, monospace; }
      .t { fill: #c9ced6; font-size: 12.5px; }
      .m { fill: #8e96a3; font-size: 11.5px; }
      .step { fill: #1c2027; stroke: #2e3440; }
      .stepn { fill: #3d7bff; font-size: 11px; font-weight: 700; }
      .flow { stroke: #8fb0ff; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flowA { stroke: #f2a93b; stroke-width: 1.8; fill: none; marker-end: url(#arrowAmber); stroke-dasharray: 5 4; }
      .lbl { fill: #8fb0ff; font-size: 11px; }
      .lblA { fill: #f2a93b; font-size: 11px; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#0d0f12"/>
  <text x="30" y="30" class="title" font-size="17">API Health Monitor · one Node process, zero runtime dependencies</text>

  <!-- Clients -->
  <rect class="panel" x="30" y="60" width="230" height="170" rx="12"/>
  <text x="48" y="88" class="title">Clients</text>
  <text x="48" y="114" class="t">Dashboard (vanilla JS, SVG charts)</text>
  <text x="48" y="136" class="t">curl · CI jobs · your scripts</text>
  <text x="48" y="158" class="t">EventSource for live updates</text>
  <text x="48" y="190" class="m">ETag caching, If-Match writes,</text>
  <text x="48" y="207" class="m">Idempotency-Key on every POST</text>

  <!-- Pipeline -->
  <rect class="panel" x="300" y="60" width="300" height="372" rx="12"/>
  <text x="318" y="88" class="title">HTTP pipeline</text>
  <text x="438" y="88" class="m mono">src/http/app.js</text>
  <g>
    <rect class="step" x="318" y="102" width="264" height="34" rx="8"/><text x="330" y="124" class="stepn">1</text><text x="348" y="124" class="t">X-Request-Id · CSP · nosniff</text>
    <rect class="step" x="318" y="144" width="264" height="34" rx="8"/><text x="330" y="166" class="stepn">2</text><text x="348" y="166" class="t">Token bucket · RateLimit fields · 429</text>
    <rect class="step" x="318" y="186" width="264" height="34" rx="8"/><text x="330" y="208" class="stepn">3</text><text x="348" y="208" class="t">Bearer auth for writes (timing-safe)</text>
    <rect class="step" x="318" y="228" width="264" height="34" rx="8"/><text x="330" y="250" class="stepn">4</text><text x="348" y="250" class="t">Router: 404 vs 405 + Allow, OPTIONS</text>
    <rect class="step" x="318" y="270" width="264" height="34" rx="8"/><text x="330" y="292" class="stepn">5</text><text x="348" y="292" class="t">Accept 406 · Content-Type 415</text>
    <rect class="step" x="318" y="312" width="264" height="34" rx="8"/><text x="330" y="334" class="stepn">6</text><text x="348" y="334" class="t">Body ≤ 64 KiB (413) · JSON (400)</text>
    <rect class="step" x="318" y="354" width="264" height="34" rx="8"/><text x="330" y="376" class="stepn">7</text><text x="348" y="376" class="t">ETag / 304 · RFC 9457 problem+json</text>
  </g>
  <text x="318" y="414" class="m">Static files: same headers, traversal-safe</text>

  <!-- Handlers -->
  <rect class="panel" x="640" y="60" width="250" height="230" rx="12"/>
  <text x="658" y="88" class="title">REST resources · /v1</text>
  <text x="658" y="114" class="t mono" font-size="12">monitors[/{id}]</text><text x="800" y="114" class="m">CRUD, If-Match</text>
  <text x="658" y="136" class="t mono" font-size="12">monitors/{id}/state</text>
  <text x="658" y="158" class="t mono" font-size="12">monitors/{id}/checks</text><text x="815" y="158" class="m">log, run</text>
  <text x="658" y="180" class="t mono" font-size="12">monitors/{id}/stats</text><text x="815" y="180" class="m">p50-p99</text>
  <text x="658" y="202" class="t mono" font-size="12">incidents[/{id}]</text>
  <text x="658" y="224" class="t mono" font-size="12">overview</text><text x="740" y="224" class="m">dashboard read model</text>
  <text x="658" y="246" class="t mono" font-size="12">events</text><text x="720" y="246" class="m">Server-Sent Events</text>
  <text x="658" y="268" class="t mono" font-size="12">openapi.json</text><text x="760" y="268" class="m">drift-tested</text>

  <!-- SQLite -->
  <rect class="panel" x="930" y="60" width="240" height="230" rx="12"/>
  <text x="948" y="88" class="title">SQLite (WAL)</text>
  <text x="1050" y="88" class="m mono">node:sqlite</text>
  <text x="948" y="116" class="t mono" font-size="12">monitors</text><text x="1030" y="116" class="m">version → ETag</text>
  <text x="948" y="140" class="t mono" font-size="12">checks</text><text x="1030" y="140" class="m">keyset index</text>
  <text x="948" y="164" class="t mono" font-size="12">incidents</text><text x="1030" y="164" class="m">one open / monitor</text>
  <text x="948" y="188" class="t mono" font-size="12">idempotency_keys</text><text x="1085" y="188" class="m">24 h</text>
  <text x="948" y="222" class="m">Migrations via PRAGMA user_version.</text>
  <text x="948" y="240" class="m">Check + state + incident written</text>
  <text x="948" y="258" class="m">in one transaction.</text>

  <!-- Scheduler -->
  <rect class="panel" x="640" y="330" width="250" height="150" rx="12"/>
  <text x="658" y="358" class="title">Scheduler</text>
  <text x="658" y="384" class="t">1 s tick, per-monitor jitter</text>
  <text x="658" y="406" class="t">bounded worker pool (8)</text>
  <text x="658" y="428" class="t">never overlaps a monitor</text>
  <text x="658" y="456" class="m">hourly retention prune</text>

  <!-- Checker -->
  <rect class="panel" x="930" y="330" width="240" height="150" rx="12"/>
  <text x="948" y="358" class="title">Checker</text>
  <text x="948" y="384" class="t">SSRF guard inside DNS lookup</text>
  <text x="948" y="406" class="t">DNS → TCP → TLS → TTFB → body</text>
  <text x="948" y="428" class="t">assertions → up / degraded / down</text>
  <text x="948" y="456" class="m">2 KiB sample kept only on failure</text>

  <rect class="panel" x="930" y="520" width="240" height="64" rx="12" style="stroke:#3d7bff"/>
  <text x="948" y="548" class="title">Monitored APIs</text>
  <text x="948" y="568" class="m">public only, unless explicitly allowed</text>

  <!-- Event hub -->
  <rect class="panel" x="300" y="460" width="300" height="70" rx="12"/>
  <text x="318" y="488" class="title">EventHub</text>
  <text x="318" y="512" class="t">ring buffer of 500 · Last-Event-ID replay</text>

  <!-- Pages -->
  <rect class="panel" x="30" y="570" width="860" height="104" rx="12" style="stroke:#f2a93b;stroke-dasharray:6 4"/>
  <text x="48" y="596" class="title">Live snapshot on GitHub Pages (no server)</text>
  <rect class="step" x="48" y="610" width="230" height="48" rx="8"/><text x="60" y="630" class="t">GitHub Actions, cron ~15 min</text><text x="60" y="648" class="m">probe "gh-actions"</text>
  <rect class="step" x="320" y="610" width="300" height="48" rx="8"/><text x="332" y="630" class="t">build-pages.js: import history, run</text><text x="332" y="648" class="m">checks, save real /v1 responses as JSON</text>
  <rect class="step" x="662" y="610" width="210" height="48" rx="8"/><text x="674" y="630" class="t">Pages: dashboard in</text><text x="674" y="648" class="m">read-only static mode</text>
  <path class="flowA" d="M278 634 H316"/><path class="flowA" d="M620 634 H658"/>

  <!-- Flows -->
  <path class="flow" d="M260 120 H296"/><text x="262" y="112" class="lbl">HTTP</text>
  <path class="flow" d="M600 170 H636"/>
  <path class="flow" d="M890 150 H926"/><path class="flow" d="M926 190 H894"/>
  <path class="flow" d="M765 290 V326"/><text x="772" y="312" class="lbl">run now</text>
  <path class="flow" d="M890 405 H926"/>
  <path class="flow" d="M1050 480 V516"/>
  <path class="flow" d="M1110 330 V294"/><text x="1116" y="316" class="lbl">record</text>
  <path class="flow" d="M640 470 Q620 495 604 495"/><text x="606" y="470" class="lbl">events</text>
  <path class="flow" d="M300 500 Q145 500 145 234"/><text x="150" y="420" class="lbl">SSE push</text>
</svg>
