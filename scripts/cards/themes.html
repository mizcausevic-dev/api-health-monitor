<!doctype html>
<!-- Source for docs/images/themes.png. Composes 14 screenshots captured with
     scripts/cards/capture.js (one per theme and scheme). Pass their folder as
     ?dir=file:///.../themes/ ; the app itself cannot be iframed (its CSP sets
     frame-ancestors 'none'). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theme gallery</title>
<style>
  html, body { margin: 0; background: #0d0f12; color: #c9ced6; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 340px); gap: 18px 18px; padding: 24px; }
  figure { margin: 0; }
  img { width: 340px; height: 212px; object-fit: cover; object-position: top left; border-radius: 10px; border: 1px solid #272c35; display: block; }
  figcaption { margin-top: 7px; font-size: 13px; }
  figcaption span { color: #8e96a3; }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const dir = new URLSearchParams(location.search).get('dir') || './';
    const themes = [['bento', 'Bento Grid'], ['cosmic', 'Cosmic Cyber'], ['swiss', 'Swiss Architect'], ['aqua', 'Aqua Web 2.0'], ['brutalist', 'Pop Brutalist'], ['steel', 'Steel Tactical'], ['parchment', 'Parchment']];
    const tiles = themes.flatMap(([id, name]) => ['dark', 'light'].map((scheme) => [id, name, scheme]));
    document.getElementById('grid').innerHTML = tiles.map(([id, name, scheme]) => `<figure><img src="${dir}${id}-${scheme}.png" alt=""><figcaption>${name} <span>· ${scheme}</span></figcaption></figure>`).join('');
  </script>
</body>
</html>
