name: Live snapshot

# Every ~15 minutes: import the history the site already publishes, run one
# real round of checks from this runner, rebuild and redeploy the site, then
# notify on incident transitions that happened in this run.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      alert_count: ${{ steps.alerts.outputs.count }}
      alerts: ${{ steps.alerts.outputs.alerts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # github.event.repository is empty on schedule events, so the URL is
      # built from the default environment variables instead.
      - name: Run checks and build the site
        run: >
          npm run build:pages --
          --run-checks
          --probe gh-actions
          --previous "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/export.json"
          --alerts-out "${RUNNER_TEMP}/alerts.json"
          --public-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
      # Incident transitions from this run, kept outside the published site.
      - name: Hand alerts to the notify job
        id: alerts
        run: |
          echo "count=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/alerts.json','utf8')).length")" >> "$GITHUB_OUTPUT"
          echo "alerts=$(base64 -w0 "${RUNNER_TEMP}/alerts.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Runs only after a successful deploy, so alerts always describe published
  # state. Webhook URL and secret are repository secrets scoped to this job;
  # without them the script exits 0 with "no webhook configured".
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.alert_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Deliver incident webhooks
        env:
          AHM_ALERTS_B64: ${{ needs.build.outputs.alerts }}
          AHM_WEBHOOK_URL: ${{ secrets.AHM_WEBHOOK_URL }}
          AHM_WEBHOOK_SECRET: ${{ secrets.AHM_WEBHOOK_SECRET }}
          AHM_WEBHOOK_FORMAT: ${{ vars.AHM_WEBHOOK_FORMAT || 'json' }}
          AHM_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'api-health-monitor' }}
        run: node scripts/deliver-alerts.js
